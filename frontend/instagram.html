<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Instagram</title>
        <meta name="theme-color" content="#0c1013" />
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap");
            body {
                font-family: "Noto Sans KR", sans-serif;
            }
            .hero-photo {
                box-shadow: 0 18px 45px rgb(0 0 0 / 0.35);
            }
        </style>
        <link
            rel="icon"
            href="https://i.ibb.co/qF5z7CxP/image.png"
            type="image/x-icon"
        />
    </head>
    <body class="min-h-screen bg-[#0c1013] text-white">
        <main class="min-h-screen flex flex-col">
            <div class="flex flex-1">
                <section
                    class="hidden lg:flex w-[65.4%] items-center justify-center border-r-[2px] border-white/20 px-10 xl:px-16 relative overflow-hidden"
                >
                    <div
                        class="absolute left-11 top-10 flex h-12 w-12 items-center justify-center rounded-xl insta-gradient"
                    >
                        <img
                            src="https://i.ibb.co/MyKYZzDq/image.png"
                            alt="인스타로고"
                        />
                    </div>
                    <div class="w-[80%] max-w-[800px] pl-10 -translate-y-1">
                        <h1
                            class="text-center text-[2.8vw] leading-[1.35] tracking-tight mx-16"
                        >
                            <span
                                class="bg-gradient-to-r from-orange-400 via-pink-500 to-fuchsia-600 bg-clip-text text-transparent"
                                >친한 친구</span
                            >의 일상 속 순간들을 확인해보세요.
                        </h1>
                        <img
                            src="https://i.ibb.co/ksVwJMg2/image.png"
                            class="relative mx-auto max-w-full"
                        />
                    </div>
                </section>

                <section
                    class="flex flex-1 items-center justify-center px-6 py-12 lg:px-12 bg-[#1f1f1f] lg:min-w-[550px]"
                >
                    <div class="w-full max-w-[510px]">
                        <div
                            class="mb-7 flex items-center justify-center gap-2 lg:hidden"
                        >
                            <span
                                class="flex h-9 w-9 items-center justify-center rounded-xl insta-gradient text-xl"
                                >◎</span
                            >
                            <span class="text-2xl font-semibold tracking-tight"
                                >Instagram</span
                            >
                        </div>
                        <h2 class="mb-6 text-base font-semibold">
                            Instagram으로 로그인
                        </h2>
                        <form id="loginForm" class="space-y-3">
                            <div class="relative">
                                <input
                                    id="username"
                                    name="username"
                                    autocomplete="username"
                                    placeholder=" "
                                    aria-label="휴대폰 번호, 사용자 이름 또는 이메일 주소"
                                    class="peer h-[60px] w-full rounded-2xl border border-[#555] bg-transparent px-3.5 pt-3 pb-0.5 text-sm text-white outline-none transition focus:border-[#8e8e8e] focus:ring-1 focus:ring-[#555]"
                                />
                                <label
                                    for="username"
                                    class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-[16px] text-[#aaa] transition-all duration-150 peer-focus:top-1.5 peer-focus:translate-y-0 peer-focus:text-[10px] peer-focus:text-[#aaa] peer-[:not(:placeholder-shown)]:top-1.5 peer-[:not(:placeholder-shown)]:translate-y-0 peer-[:not(:placeholder-shown)]:text-[10px]"
                                    >휴대폰 번호, 사용자 이름 또는 이메일
                                    주소</label
                                >
                            </div>
                            <div class="relative">
                                <input
                                    id="password"
                                    name="password"
                                    type="password"
                                    autocomplete="current-password"
                                    placeholder=" "
                                    aria-label="비밀번호"
                                    class="peer h-[60px] w-full rounded-2xl border border-[#555] bg-transparent px-3.5 pt-3 pb-0.5 text-sm text-white outline-none transition focus:border-[#8e8e8e] focus:ring-1 focus:ring-[#555]"
                                />
                                <label
                                    for="password"
                                    class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-[16px] text-[#aaa] transition-all duration-150 peer-focus:top-1.5 peer-focus:translate-y-0 peer-focus:text-[10px] peer-focus:text-[#aaa] peer-[:not(:placeholder-shown)]:top-1.5 peer-[:not(:placeholder-shown)]:translate-y-0 peer-[:not(:placeholder-shown)]:text-[10px]"
                                    >비밀번호</label
                                >
                            </div>
                            <div></div>
                            <button
                                id="loginButton"
                                type="submit"
                                disabled
                                class="h-[44px] w-full rounded-full bg-[#0064c8] text-sm font-semibold text-white transition enabled:hover:bg-[#1877d2] enabled:active:scale-[.99] disabled:cursor-not-allowed disabled:opacity-50"
                            >
                                로그인
                            </button>
                        </form>
                        <div
                            class="mt-6 flex items-center justify-center gap-1.5 text-sm font-semibold text-[#d7d7d7]"
                        >
                            <span class="text-xl">∞</span> Meta
                        </div>
                    </div>
                </section>
            </div>
            <footer
                class="flex min-h-[54px] flex-wrap items-center justify-center gap-x-4 gap-y-2 border-t border-white/20 px-4 py-4 text-[11px] text-[#aaa]"
            >
                <a href="#meta" class="text-[10px] hover:underline">Meta</a
                ><a href="#about" class="text-[10px] hover:underline">소개</a
                ><a href="#blog" class="text-[10px] hover:underline">블로그</a
                ><a href="#jobs" class="text-[10px] hover:underline"
                    >채용 정보</a
                ><a href="#help" class="text-[10px] hover:underline">도움말</a
                ><a href="#api" class="text-[10px] hover:underline">API</a
                ><a href="#privacy" class="text-[10px] hover:underline"
                    >개인정보처리방침</a
                ><a href="#terms" class="text-[10px] hover:underline">약관</a
                ><a href="#locations" class="text-[10px] hover:underline"
                    >위치</a
                ><a href="#popular" class="text-[10px] hover:underline">인기</a
                ><a href="#lite" class="text-[10px] hover:underline"
                    >Instagram Lite</a
                ><a href="#threads" class="text-[10px] hover:underline"
                    >Threads</a
                >
                <a href="#notuser" class="text-[10px] hover:underline"
                    >연락처 업로드 & 비사용자</a
                >
                <a href="#metaverified" class="text-[10px] hover:underline"
                    >Meta Verified</a
                >
            </footer>
        </main>
        <script>
            // 대충 로그인 버튼 활성화/비활성화 해주는애임
            const loginForm = document.getElementById("loginForm");
            const usernameInput = document.getElementById("username");
            const passwordInput = document.getElementById("password");
            const loginButton = document.getElementById("loginButton");

            function updateLoginButton() {
                loginButton.disabled = !(
                    usernameInput.value.trim() && passwordInput.value.length > 0
                );
            }

            usernameInput.addEventListener("input", updateLoginButton);
            passwordInput.addEventListener("input", updateLoginButton);

            loginForm.addEventListener("submit", function (event) {
                event.preventDefault();
                if (loginButton.disabled) return;
                document.getElementById("notice").classList.remove("hidden");
            });

            updateLoginButton();
        </script>
    </body>
</html>
