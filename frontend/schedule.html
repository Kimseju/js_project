    <script>
      const calendar = document.querySelector("#calendar");
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();

      document.querySelector(".title").textContent =
        `${now.toLocaleString("en-US", { month: "long" }).toUpperCase()} ${year}`;

      const offset = (new Date(year, month, 1).getDay() + 6) % 7;
      const lastDay = new Date(year, month + 1, 0).getDate();

      const cellClass = `
  h-[110px] max-md:h-16 p-2 max-md:p-1 align-top cursor-pointer
  rounded-[4px] border border-[rgba(93,63,60,0.10)]
  bg-[#1F1F20] text-[#E5E2E3] font-['Hanken_Grotesk'] text-base
  data-selected:bg-[#2A2A2B] data-selected:text-[#FFB4AA]
  data-selected:font-['Anton'] data-selected:text-2xl
  data-selected:shadow-[0_0_0_1px_#FFB4AA,0_1px_2px_0_rgba(0,0,0,0.05)]
`;

      let row;
      for (let i = 0; i < offset + lastDay; i++) {
        if (i % 7 === 0)
          row = calendar.appendChild(document.createElement("tr"));

        const td = row.appendChild(document.createElement("td"));
        const day = i - offset + 1;
        if (day < 1) continue;

        td.textContent = day;
        td.dataset.day = day;
        td.className = cellClass;
        if (day === now.getDate()) {
          td.dataset.selected = "";
        }
      }

      calendar.addEventListener("click", ({ target }) => {
        if (!target.dataset.day) return;
        calendar
          .querySelector("[data-selected]")
          ?.removeAttribute("data-selected");
        target.dataset.selected = "";
      });
    </script>
